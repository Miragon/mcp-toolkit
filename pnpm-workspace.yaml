packages:
  - "packages/*"
  - "examples/*"
  - "docs"

overrides:
  # The docs site (docs/): VitePress 1.6.4 asks for vite ^5.4.14, below the fixes for its dev
  # server. An exact pin, not a range: it is the vite the Miragon docs kit
  # (docs/.vitepress/miragon/) is built and tested with, and it moves only with a release of
  # Miragon/corporate-identity (skill docs-site).
  "vitepress>vite": 6.4.5

peerDependencyRules:
  allowedVersions:
    # vitepress-plugin-mermaid 2.0.17 asks for mermaid 10 or 11; the Miragon docs kit pins 12.
    "vitepress-plugin-mermaid>mermaid": "12"

# pnpm resolves no version published less than 7 days ago (in minutes), direct or transitive: the
# window of Dependabot's npm cooldown (.github/dependabot.yml), and scripts/release-config.test.mjs
# holds the two equal. pnpm 11 checks every version in the lockfile against that window on every
# install, --frozen-lockfile included (trustLockfile stays false): one younger version anywhere in
# the workspace fails every install, in CI and in Dependabot's runs. Only a security update, which
# Dependabot runs without the window, brings in a younger version; its pull request then needs the
# fix in minimumReleaseAgeExclude as name@version until it is 7 days old (CONTRIBUTING.md).
minimumReleaseAge: 10080

# dependencies and devDependencies are exact pins; pnpm 11 reads only auth and registry settings
# from .npmrc, so the setting lives here. The dependencies of a published package are the
# exception: caret ranges, edited by hand (scripts/dependency-ranges.test.mjs).
saveExact: true

# pnpm 11 fails an install on a dependency build script it was not told about. esbuild's
# postinstall only verifies the platform binary that its optional dependency already installs.
allowBuilds:
  esbuild: false
