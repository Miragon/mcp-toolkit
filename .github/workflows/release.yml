name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Pack tarballs and validate registry auth without uploading"

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@miragon"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

      - run: pnpm -r --if-present run test

      - run: pnpm -r run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm publish -r \
            --filter "@miragon/mcp-toolkit-proxy-contract" \
            --filter "@miragon/mcp-toolkit-core" \
            --filter "@miragon/mcp-toolkit-tool-codegen" \
            --filter "@miragon/mcp-toolkit-ui" \
            --no-git-checks --access restricted ${{ inputs.dry_run && '--dry-run' || '' }}
