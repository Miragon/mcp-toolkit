name: Release (manual fallback)

# Automatic publishing runs from `release-please.yml`'s `publish` job, gated on
# `release_created`. This workflow is the manual fallback: dispatch it to
# re-publish the current `main` (e.g. after a failed automatic run) or to
# validate registry auth with `dry_run`. It is no longer triggered by the v*
# tags release-please pushes — those tags never fired a workflow because the
# default GITHUB_TOKEN suppresses follow-up runs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Pack tarballs and validate registry auth without uploading"

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@miragon"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

      - run: pnpm -r --if-present run test

      - run: pnpm -r run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm publish -r \
            --filter "@miragon/mcp-toolkit-core" \
            --filter "@miragon/mcp-toolkit-tool-codegen" \
            --filter "@miragon/mcp-toolkit-ui" \
            --no-git-checks --access restricted ${{ inputs.dry_run && '--dry-run' || '' }}
