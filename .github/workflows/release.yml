name: Release (manual fallback)

# Automatic publishing runs from `release-please.yml`'s `publish` job, gated on
# `release_created`. This workflow is the manual fallback: dispatch it to
# re-publish the current `main` (e.g. after a failed automatic run) or to
# validate registry auth with `dry_run`. It is no longer triggered by the v*
# tags release-please pushes — those tags never fired a workflow because the
# default GITHUB_TOKEN suppresses follow-up runs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Pack tarballs and validate registry auth without uploading"

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@miragon"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

      - run: pnpm -r --if-present run test

      - run: pnpm -r run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm publish -r \
            --filter "@miragon/mcp-toolkit-proxy-contract" \
            --filter "@miragon/mcp-toolkit-core" \
            --filter "@miragon/mcp-toolkit-tool-codegen" \
            --filter "@miragon/mcp-toolkit-ui" \
            --no-git-checks --access restricted ${{ inputs.dry_run && '--dry-run' || '' }}
