name: Mutation full sweep

# Full-allowlist mutation runs for baseline maintenance and as the escape
# hatch when the PR diff gate hits its file cap (see FITNESS.md phase 4).
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-full:
    name: Full mutation sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Full sweep — core
        run: pnpm --filter @miragon/mcp-toolkit-core exec stryker run

      - name: Full sweep — ui
        run: pnpm --filter @miragon/mcp-toolkit-ui exec stryker run

      - name: Full sweep — tool-codegen
        run: pnpm --filter @miragon/mcp-toolkit-tool-codegen exec stryker run

      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full-reports
          path: packages/*/reports/mutation/mutation.json
          if-no-files-found: warn
