name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (build-side gates — same manifest as pnpm verify)
        run: node scripts/verify.mjs --only=typecheck,template,build,standalone-dev,depcruise-dist,exports,test,codegen-drift

      - name: Upload coverage summaries (consumed by the fitness-report job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summaries
          path: packages/*/coverage/coverage-summary.json
          if-no-files-found: warn

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: scripts/check-ratchets.mjs diffs against the
          # merge-base and refuses to run on a shallow clone
          fetch-depth: 0

      - name: Enforce pinned dependencies
        uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (quality-side gates — same manifest as pnpm verify)
        run: node scripts/verify.mjs --only=pins,ratchets,erosion,depcruise,knip,flaky-changed,lint,lint-templates,format

      - name: Analysis reports for the fitness-report job
        run: |
          mkdir -p reports
          pnpm depcruise:report
          pnpm knip:report > reports/knip.json

      - name: Upload analysis reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-reports
          path: reports/
          if-no-files-found: warn

  brand:
    name: Brand (CI source + brand-lint)
    runs-on: ubuntu-latest
    env:
      # Read access to the private Miragon/corporate-identity. Without the secret
      # (not set up yet, or a fork PR) the job warns and skips; check.mjs against the
      # kit's manifest still runs in the Docs workflow and in examples/test/docs-theme.test.ts.
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the docs kit is not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep ref on the release named in docs/.vitepress/miragon/manifest.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.10.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 22

      - name: Docs kit equals the CI source
        if: env.CI_SOURCE_TOKEN != ''
        run: node docs/.vitepress/miragon/check.mjs --ci .ci-source

      # Rules and exceptions come from .miragon/brand.json.
      - name: brand-lint
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart docs README.md

  mutation:
    name: Mutation diff gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Mutate changed allowlisted files (cap 25, loud skip)
        run: node scripts/mutation-diff.mjs

      - name: Upload mutation reports
        # runs on failure too — a red mutation report is exactly what the
        # fitness report must show; !cancelled() (not always()) so a
        # cancelled run doesn't spawn the upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: |
            packages/*/reports/mutation/mutation.json
            reports/mutation/SKIPPED.json
          if-no-files-found: warn

  fitness-report:
    name: Fitness report
    needs: [build, quality, mutation]
    # !cancelled(): run even when a needed job failed or was skipped (push
    # builds have no mutation job) — but never after a cancel-in-progress
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage summaries
        # optional: an artifact may not exist (failed producer) — the report
        # renders "no run" instead of failing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summaries
          path: packages/

      - name: Download mutation reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-reports
          path: .

      - name: Download analysis reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-reports
          path: reports/

      - name: Render the fitness report into the job summary
        run: node scripts/fitness-report.mjs
