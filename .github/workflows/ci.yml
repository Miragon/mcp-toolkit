name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate that runs code, on the oldest Node.js line the published packages support (their
  # engines) and on the newest LTS, the dev toolchain (the root engines). The legs' checks carry the
  # Node.js line in their names; the required check is the job "build" below.
  test:
    name: Typecheck + Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the workspace packages resolve each other through their built dist.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test:coverage

      # The examples measure no coverage (no test:coverage script); their tests are the drift
      # gate of the committed generated code.
      - name: Example tests (codegen drift gate)
        run: pnpm --fail-if-no-match --filter "./examples/*" test

      - run: pnpm check:exports

  # The repository ruleset requires the check "Typecheck + Build" by name, and a matrix names its
  # checks per leg. This job carries the name and passes only when every leg passed; !cancelled()
  # runs it after a failed leg too, since a skipped job would count as passed.
  build:
    name: Typecheck + Build
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every Node.js leg passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::A Node.js leg of \"Typecheck + Build\" ended with $RESULT."
            exit 1
          fi

  # Not required. The lowest versions the published ranges admit: the generator's tests on the
  # first Node.js its engines range allows (22.18 loads the default codegen.config.ts) and against
  # the lower bound of each of its dependencies, which the lockfile moves past (Dependabot keeps
  # the ranges), and the React package's tests and type tests against the lower bound of each peer
  # range. The generator's tests type-check generated hooks against those peers too.
  # scripts/dependency-ranges.test.mjs holds these versions equal to the ranges.
  lower-bounds:
    name: Lower bounds (Node.js 22.18.0, React 19.0.0, TanStack Query 5.100.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the lowest versions of the React package's peers
        run: >-
          pnpm --fail-if-no-match --filter @miragon/mcp-toolkit-tool-codegen-react
          add --save-dev --save-exact
          react@19.0.0 react-dom@19.0.0 @types/react@19.0.0 @types/react-dom@19.0.0
          @tanstack/react-query@5.100.2

      - name: Install the lowest versions of the generator's dependencies
        run: >-
          pnpm --fail-if-no-match --filter @miragon/mcp-toolkit-tool-codegen
          add --save-prod --save-exact
          @modelcontextprotocol/client@2.4.0 handlebars@4.7.10
          json-schema-to-typescript@16.0.0 prettier@3.9.10

      - run: pnpm --fail-if-no-match --filter "./packages/*" run build

      - run: pnpm --fail-if-no-match --filter @miragon/mcp-toolkit-tool-codegen-react run typecheck

      - run: pnpm --fail-if-no-match --filter @miragon/mcp-toolkit-tool-codegen-react run test

      - run: pnpm --fail-if-no-match --filter @miragon/mcp-toolkit-tool-codegen run test

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every manifest whose dependencies and devDependencies are exact pins. The generator's
      # dependencies are caret ranges, as a published package's must be, so its manifest is not
      # listed; scripts/dependency-ranges.test.mjs pins its devDependencies and holds this list
      # complete.
      - name: Enforce pinned dependencies
        uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
        with:
          files: |
            package.json
            packages/tool-codegen-core/package.json
            packages/tool-codegen-react/package.json
            examples/tasks/package.json
            docs/package.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # The workflow and package-script shape the release depends on (scripts/*.test.mjs).
      - run: pnpm test:scripts

  # Which gates a pull request's diff reaches. The jobs read it in a job-level if, never through a
  # workflow-level paths filter: a required check whose workflow never starts stays pending, while
  # a job skipped by its if reports success.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mutation: ${{ steps.scope.outputs.mutation }}
    steps:
      # The pull request's merge commit and its parents: HEAD^1 is the base branch, so
      # HEAD^1..HEAD is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - id: scope
        run: node scripts/mutation-scope.mjs HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  # The job name is kept because the repository ruleset requires the check "Mutation diff gate".
  # The diff decides whether it runs, not what it mutates: a pull request that changes what the
  # suites mutate or read (scripts/mutation-scope.mjs) runs the full Stryker suites of
  # tool-codegen and tool-codegen-core, each named in the root test:mutation script (a missing
  # script fails it), never a diff-scoped selection. Only an explicit "false" from the changes
  # job skips it, so a failed changes job runs the suites.
  mutation:
    name: Mutation diff gate
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.changes.outputs.mutation != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:mutation

      - name: Upload mutation reports
        # runs on failure too: a red run is when the report is needed; !cancelled() (not
        # always()) so a cancelled run doesn't spawn the upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: packages/*/reports/mutation/mutation.json
          if-no-files-found: warn
