name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

      - run: pnpm -r run build

      - run: pnpm depcruise:dist

      - run: pnpm -r --if-present run test:coverage

      - name: Codegen drift check (committed generated/ vs current generator)
        run: pnpm --filter @miragon/mcp-toolkit-examples run generate:check:ci

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: scripts/check-ratchets.mjs diffs against the
          # merge-base and refuses to run on a shallow clone
          fetch-depth: 0

      - name: Enforce pinned dependencies
        uses: miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ratchet self-protection (thresholds only move one way)
        run: node scripts/check-ratchets.mjs

      - run: pnpm -r run lint

      - run: pnpm lint:templates

      - run: pnpm depcruise

      - run: pnpm format:check
