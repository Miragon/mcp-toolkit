name: Publish npm package

# Reusable workflow: publishes one package under packages/ to the public npm registry with OIDC
# trusted publishing (no NPM_TOKEN), provenance attached.
#
# The job that holds the id-token runs no package manager and no code of this repository: the
# pack job installs, builds and packs without that permission, and the publish job only uploads
# the tarball, with lifecycle scripts off. npm checks the CALLING workflow, so each package's
# trusted publisher on npmjs.com names release-please.yml and the environment npm (README,
# "Releases").
on:
  workflow_call:
    inputs:
      package:
        description: Package directory name under packages/
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      published: ${{ steps.pack.outputs.published }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The published packages only: the example's build (Vite and its plugins) never runs here.
      - run: pnpm --fail-if-no-match --filter "./packages/*" run build

      - name: Pack packages/${{ inputs.package }}
        id: pack
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          dir="packages/$PACKAGE"
          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm: skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pack"
          # pnpm pack, not npm pack: it rewrites the workspace: ranges to versions.
          (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          echo "tarball=$(basename "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"
          echo "published=false" >> "$GITHUB_OUTPUT"

      - if: steps.pack.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ inputs.package }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: pack
    if: needs.pack.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ inputs.package }}
          path: tarball

      - name: Publish ${{ needs.pack.outputs.tarball }}
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: npm publish "tarball/$TARBALL" --provenance --access public --ignore-scripts
