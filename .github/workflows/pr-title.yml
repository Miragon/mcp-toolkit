name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Squash-merging a single-commit PR uses the commit's subject, not the PR title
        # (squash_merge_commit_title: COMMIT_OR_PR_TITLE), and that subject drives
        # release-please: check it too, and that it matches the title.
        with:
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
