name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Run the publish path with npm publish --dry-run, without the id-token and without touching the Release PR"
      force_publish:
        type: boolean
        default: false
        description: "Publish the release tag of the version in package.json again (recovers a failed publish; main only)"

# The GITHUB_TOKEN only reads: release-please writes with the GitHub App's token, and the publish
# jobs ask for the id-token themselves.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-flight release

jobs:
  release-please:
    name: Open or update Release PR
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One publish job per package, each calling the reusable OIDC workflow, which packs a release
  # tag: the one release-please just created, else (force_publish, a dry run) the tag of the
  # version in package.json, never what main holds at dispatch time (only a dry run of a version
  # without a tag yet packs the dispatched commit). They publish to the public npm registry with
  # provenance; the reusable workflow skips any package whose version is already on npm, so a
  # partial release can be safely re-run. They run in dependency order: the generated hooks
  # import react, react imports core, and generated code must never be on npm ahead of its
  # runtime. force_publish publishes main only.
  #
  # dry_run skips release-please and runs the same jobs with npm publish --dry-run. The id-token
  # granted here is for the reusable workflow's publish job, which a dry run skips: its dry-run
  # job asks for no id-token and no environment. !cancelled() && !failure() lets the jobs run
  # after a skipped release-please, never after a failed one or a failed runtime package.
  publish-tool-codegen-core:
    name: Publish tool-codegen-core
    needs: release-please
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || (inputs.force_publish && github.ref == 'refs/heads/main')))) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: tool-codegen-core
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  publish-tool-codegen-react:
    name: Publish tool-codegen-react
    needs: [release-please, publish-tool-codegen-core]
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || (inputs.force_publish && github.ref == 'refs/heads/main')))) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: tool-codegen-react
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  publish-tool-codegen:
    name: Publish tool-codegen
    needs: [release-please, publish-tool-codegen-core, publish-tool-codegen-react]
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || (inputs.force_publish && github.ref == 'refs/heads/main')))) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: tool-codegen
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
