name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Validate packaging/publish without opening a Release PR or releasing"
      force_publish:
        type: boolean
        default: false
        description: "Publish the versions currently in package.json even without a new release (recovers a failed publish)"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-flight release

jobs:
  release-please:
    name: Open or update Release PR
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One publish job per package, each calling the reusable OIDC workflow. They
  # publish to the public npm registry with provenance; the reusable workflow
  # skips any package whose current version is already on npm, so a partial
  # release can be safely re-run.
  publish-core:
    name: Publish core
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: core

  publish-tool-codegen:
    name: Publish tool-codegen
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: tool-codegen

  publish-ui:
    name: Publish ui
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: ui

  # Manual fallback: `workflow_dispatch` with dry_run=true validates that the
  # three packages pack cleanly against the public npm registry, without
  # releasing or uploading anything.
  dry-run:
    name: Dry-run publish
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run typecheck

      - run: pnpm -r --if-present run test

      - run: pnpm -r run build

      - name: Pack (dry-run)
        run: |
          pnpm publish -r \
            --filter "@miragon/mcp-toolkit-core" \
            --filter "@miragon/mcp-toolkit-tool-codegen" \
            --filter "@miragon/mcp-toolkit-ui" \
            --access public --no-git-checks --dry-run
