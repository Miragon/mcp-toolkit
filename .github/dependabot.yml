version: 2
updates:
  # Config for npm dependencies (pnpm monorepo) — majors get individual PRs
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Without a prefix Dependabot writes feat(deps): release-please would cut a minor release of
    # all three packages for a dev-only bump. A runtime dependency is a fix, a dev one a chore.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    # One window for every update type, equal to pnpm's minimumReleaseAge (pnpm-workspace.yaml):
    # Dependabot hands a cooldown longer than pnpm's window to pnpm as the minimum release age, and
    # pnpm checks the versions already in the lockfile against it, so a longer one fails every
    # update on a locked version between the two (ERR_PNPM_NO_MATURE_MATCHING_VERSION,
    # "update_not_possible"). A shorter one has no effect: Dependabot raises every cooldown to
    # pnpm's window. Security updates skip both windows.
    cooldown:
      default-days: 7
    ignore:
      # Hold vitest on 4.x until @stryker-mutator/vitest-runner supports
      # vitest 5. Runner 10.0.0 filters each mutant run by space-joined test
      # names, while vitest 5 matches testNamePattern against " > "-joined
      # full names: every mutant run executes 0 tests and "survives", so the
      # required mutation gate reads ~0 (a sweep fell from 75.77 to 2.32
      # after the 5.0 bump in #169). Drop this once a runner release
      # supports vitest 5 and the mutation gate on the bump PR is green.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # The docs site's pins (docs/package.json) are the versions the Miragon docs kit is built
      # and tested with. They move only with a release of the kit, by hand, as CONTRIBUTING.md
      # (section Docs) describes; a grouped bump here would be auto-merged.
      - dependency-name: "vitepress"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitepress-plugin-mermaid"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "mermaid"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@fontsource-variable/geist"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@fontsource-variable/geist-mono"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@braintree/sanitize-url"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "cytoscape"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "cytoscape-cose-bilkent"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "dayjs"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "debug"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Config for GitHub Actions — fully grouped (SHA-pinned + CI-gated)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    # github-actions supports only `default-days`; the granular semver-*-days
    # keys are npm/package-manager-only per the Dependabot options reference.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
