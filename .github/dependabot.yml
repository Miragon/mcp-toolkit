version: 2
updates:
  # Config for npm dependencies (pnpm monorepo) — majors get individual PRs
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Config for GitHub Actions — fully grouped (SHA-pinned + CI-gated)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # github-actions supports only `default-days`; the granular semver-*-days
    # keys are npm/package-manager-only per the Dependabot options reference.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Config for the playground Docker base image
  - package-ecosystem: "docker"
    directory: "/deploy/playground"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
