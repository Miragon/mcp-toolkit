version: 2
updates:
  # Config for npm dependencies (pnpm monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Config for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github-actions supports only `default-days`; the granular semver-*-days
    # keys are npm/package-manager-only per the Dependabot options reference.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
