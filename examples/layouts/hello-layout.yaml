# Input layout for `render-view` against the hello-full module.
#
#   tools/call render-view '{
#     "keys": { "hello:name": "Ada" },
#     "layout": <this document>
#   }'
#
# The pipeline sees `hello:name` in keys, runs `hello:greet`, produces
# `hello:greeting`, which satisfies the `hello:greeting-card` widget.
rows:
  - row:
      - widget: hello:greeting-card
        span: 6
