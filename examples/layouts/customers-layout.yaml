# Input layout for `render-view` against the customers module
# (served entirely by customers-upstream — step + widget both upstream-hosted).
#
#   tools/call render-view '{
#     "keys": { "customers:customerId": "c1" },
#     "steps": [{ "id": "customer", "step": "customers:resolve-customer" }],
#     "layout": <this document>
#   }'
#
# The `customers:resolve-customer` declarative step calls `get-customer`
# on the upstream, produces `customers:customer`, which satisfies the
# `customers:customer-card` widget. The widget component itself is NOT
# bundled into the host — it is fetched at render time through the
# `read-widget-bundle` tool and evaluated via the browser widget loader.
rows:
  - row:
      - widget: customers:customer-card
        span: 6
